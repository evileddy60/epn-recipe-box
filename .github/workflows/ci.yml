name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python
        run: python -m py_compile app.py sync.py recipe_box/*.py tools/*.py tests/*.py
      - name: Ruff lint
        run: ruff check app.py recipe_box sync.py tests tools
      - name: Ruff format check
        run: ruff format --check app.py recipe_box sync.py tests tools
      - name: Automated tests, migrations, backups, and synchronization contracts
        env:
          EPN_ENV: development
        run: python -m unittest discover -s tests -v
      - name: Focused security scan
        run: bandit -q -r recipe_box tools sync.py app.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Whitespace validation
        run: git diff --check
