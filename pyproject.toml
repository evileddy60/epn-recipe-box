[project]
name = "epn-recipe-box"
version = "0.1.0"
description = "Small Flask recipe box with peer synchronization"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "gunicorn==23.0.0",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.12.10",
  "bandit==1.8.6",
  "pip-audit==2.9.0",
]

[tool.ruff]
line-length = 140
exclude = ["data", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702", "F401", "F403", "F405", "F841"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
