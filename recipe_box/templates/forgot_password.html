{% extends "base.html" %}
{% block content %}
<section class="auth-layout" aria-label="Password recovery">
  <div class="panel auth-primary">
    <p class="box-label">Welcome back</p>
    <h2>Forgot password?</h2>
    <p class="small">Enter your account email and we will send password reset instructions if an account exists.</p>
    <form method="post">
      {{ csrf_input() }}
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <button type="submit">Send reset instructions</button>
    </form>
    <p class="small"><a href="{{ url_for('signup') }}#sign-in">Back to sign in</a></p>
  </div>
</section>
{% endblock %}
