{% extends "base.html" %}
{% block content %}
<section class="auth-layout" aria-label="Password recovery">
  <div class="panel auth-primary">
    <p class="box-label">Check your inbox</p>
    <h2>Reset instructions sent</h2>
    <p class="small">If an account exists for that email, password reset instructions have been sent.</p>
    <p class="small"><a href="{{ url_for('signup') }}#sign-in">Return to sign in</a></p>
  </div>
</section>
{% endblock %}
