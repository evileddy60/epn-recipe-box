{% extends "base.html" %}
{% block content %}
<section class="auth-layout" aria-label="Choose a new password">
  <div class="panel auth-primary">
    <p class="box-label">Welcome back</p>
    <h2>Choose a new password</h2>
    <p class="small">Use a password between 8 and 128 characters.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      {{ csrf_input() }}
      <input type="hidden" name="token" value="{{ token }}">
      <label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <label>Confirm password<input type="password" name="confirmation" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <button type="submit">Reset password</button>
    </form>
  </div>
</section>
{% endblock %}
